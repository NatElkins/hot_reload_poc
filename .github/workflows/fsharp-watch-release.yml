name: Publish F# watch preview

on:
  push:
    branches: [main]
    paths: ['tools/fsharp-watch/**', '.github/workflows/fsharp-watch-*.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsharp-watch-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/fsharp-watch-ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fsharp-watch-package
          path: package
      - name: Verify publisher configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo 'Set NUGET_USER to the NuGet profile with the trusted publisher policy.' >&2
            exit 1
          fi
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the verified archive
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push package/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
